name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:package
      - run: npm run test:skill
      - run: npm run build:skill
      - uses: actions/upload-artifact@v4
        with:
          name: jev-skill-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            artifacts/jev-mcp-skill-*.zip
            artifacts/jev-mcp-skill-*.zip.sha256
